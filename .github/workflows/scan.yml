
name: Oil and Gas Job Scan

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: oil-gas-pages
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          
      
      - name: Inspect company files
        run: |
          echo "Current commit:"
          git rev-parse --short HEAD
          echo "All tracked paths:"
          git ls-files | cat -A
          echo "Repository contents:"
          ls -la
          echo "Company file candidates:"
          find . -maxdepth 3 -iname '*companies*' -print
          echo "Expected CSV:"
          if [ -f data/companies.csv ]; then
            wc -l data/companies.csv
            head -n 3 data/companies.csv
          else
            echo "Expected CSV not found"
          fi

          
      - name: Prepare company database
        run: |
          mkdir -p data
          if [ ! -f data/companies.csv ]; then
            if [ -f companies.csv ]; then
              cp companies.csv data/companies.csv
            else
              printf 'name,country,website,careers_url\n' > data/companies.csv
            fi
          fi
          echo "Company database ready:"
          cat data/companies.csv


      - name: Install dependencies
        run: npm install

      - name: TypeScript check
        run: npm run check

      - name: Scan companies
        run: npm run scan
        env:
          MAX_COMPANIES: "500"
      - name: Scan job boards
        run: npx tsx src/scanJobBoards.ts
      - name: Build dashboard
        run: npm run build

      - name: Upload Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy Pages
        uses: actions/deploy-pages@v4
